
services:
  backend:
    image: regforge-backend:1.0.2
    
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: regforge-backend

    restart: unless-stopped

    ports:
      - "8001:8001"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/secrets:/app/secrets:ro

    environment:
      PYTHONPATH: /app

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
