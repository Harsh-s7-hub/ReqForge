services:
  neo4j:
    image: neo4j:5-community
    container_name: reqforge-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/reqforge123

    volumes:
      - reqforge_neo4j_data:/data
      - reqforge_neo4j_logs:/logs

volumes:
  reqforge_neo4j_data:
  reqforge_neo4j_logs: